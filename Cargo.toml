[package]
name = "nanochat"
version = "0.1.0"
edition = "2021"

[dependencies]
candle-core = { version = "0.9.2", features = ["accelerate"] }
candle-nn = { version = "0.9.2", features = ["accelerate"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rand = "0.9.0"
rand_distr = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fancy-regex = "0.14"
regex = "1.10"
base64 = "0.22"
reqwest = { version = "0.12", features = ["blocking"] }
parquet = { version = "54", default-features = false, features = ["snap", "flate2", "zstd"] }
env_logger = "0.11.9"
log = "0.4.29"

[features]
default = []

[profile.release]
debug = true

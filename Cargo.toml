[package]
name = "nanochat"
version = "0.1.0"
edition = "2021"

[dependencies]
candle-core = { version = "0.9.2" }
candle-nn = { version = "0.9.2" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rand = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = "0.22.1"
regex = "1.10.3"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["blocking"] }
env_logger = "0.11.9"
log = "0.4.29"

[features]
default = []
